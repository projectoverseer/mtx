name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ffmpeg is optional at runtime, but the loudness cross-check is one of
      # the things worth testing, so install it where it is cheap to do so.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Self-test (synthetic signals with known answers)
        run: mtx selftest

      - name: Unit tests
        run: pytest -q

      - name: End-to-end on a generated file
        run: |
          python tools/make_test_signal.py ci_signal.flac --seconds 30
          mtx analyze ci_signal.flac --out ci_out --single-out
          mtx analyze ci_signal.flac --profile quick --out ci_out_quick --single-out
          python -c "import os,sys; s=os.path.getsize('ci_out/digest.md'); print(f'digest {s} bytes'); sys.exit(0 if s <= 12*1024 else 'digest exceeded the 12 KB budget')"
