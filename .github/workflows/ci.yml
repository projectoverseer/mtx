name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ffmpeg is optional at runtime, but the loudness cross-check is one of
      # the things worth testing, so install it where it is cheap to do so.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Self-test (synthetic signals with known answers)
        run: mtx selftest

      - name: Unit tests
        run: pytest -q

      - name: End-to-end on a generated file
        run: |
          python tools/make_test_signal.py ci_signal.flac --seconds 30
          mtx analyze ci_signal.flac --out ci_out --single-out
          mtx analyze ci_signal.flac --profile quick --out ci_out_quick --single-out
          python -c "import os,sys; s=os.path.getsize('ci_out/digest.md'); print(f'digest {s} bytes'); sys.exit(0 if s <= 12*1024 else 'digest exceeded the 12 KB budget')"

      - name: Blind mode, prediction scoring, sections, budget and the CSV schema
        run: |
          mtx analyze ci_signal.flac --out ci_blind --single-out --profile quick --blind
          python -c "import re,sys; t=open('ci_blind/predict.md',encoding='utf-8').read(); h=open('ci_blind/digest.md',encoding='utf-8').read(); v=re.search(r'^LUFS-I\s+(\S+)',h.split('## HEADLINE')[1],re.M).group(1); sys.exit(0 if v not in t else 'the prediction sheet leaked a measured value')"
          python -c "open('ci_pred.txt','w',encoding='utf-8').write('LUFS-I = -9.0 +/- 1.0 conf 70%')"
          mtx predict --check ci_pred.txt ci_blind/digest.md
          mtx analyze ci_signal.flac --out ci_sec --single-out --profile quick --sections stereo,forensics
          mtx analyze ci_signal.flac --out ci_big --single-out --profile quick --digest-budget 20k
          mtx batch . --out ci_batch --profile quick --csv ci_masters.csv --csv-schema corpus
          python -c "import csv; h=next(csv.reader(open('ci_masters.csv',encoding='utf-8'))); assert 'LUFS-I' in h and 'PSR min' in h and 'mtx run' in h, h"
